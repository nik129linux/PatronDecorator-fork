# ============================================================
# Electronic Invoice Composer — Application Properties
# ============================================================

server.port=${SERVER_PORT:8080}

# CORS — configurable allowed origins for frontend communication
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5500}

# Application info
spring.application.name=invoice-composer

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
